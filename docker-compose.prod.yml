services:
  ai-os:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ai_os_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ai_os_data:
